name: Loadtest Docker Image CI

on:
  push:
    tags:
      - 'loadtest-*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Get tag name
        id: tagname
        run: echo "tag=${GITHUB_REF#refs/tags/loadtest-}" >> "$GITHUB_ENV"

      - name: Get latest CMSRUCIO_GITTAG
        id: cmsrucio_gittag
        run: |
          LATEST_TAG=$(git ls-remote --tags --refs origin 'release-*.cms*' | awk -F/ '{print $NF}' | sort -V | tail -n1)
          echo "cmsrucio_gittag=$LATEST_TAG" >> "$GITHUB_ENV"

      - name: Login to CERN Harbour
        uses: docker/login-action@v2
        with:
          registry: registry.cern.ch
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Build the Docker Image
        run: |
          cd docker/rucio_client && docker build . \
          --file Dockerfile.loadtest \
          --build-arg CMSRUCIO_GITTAG=${{ env.cmsrucio_gittag }} \
          --tag registry.cern.ch/${{ vars.HARBOR_REPOSITORY }}/rucio-loadtest-client:${{ env.tag }}
      
      - name: Push Image to CERN Harbour
        run: docker push registry.cern.ch/${{ vars.HARBOR_REPOSITORY }}/rucio-loadtest-client:${{ env.tag }}

